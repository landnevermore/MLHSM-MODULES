name: validate-registry

on:
  pull_request:
    paths:
      - "registry.json"
      - "modules/**"
      - "schema/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry and manifests
        run: python scripts/validate_registry.py
      - name: Schemas are valid JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path("registry.json"), *Path("schema").glob("*.json"),
                   *Path("modules").glob("*/module.json"),
                   *Path("templates").glob("**/*.json")]
          for p in paths:
              json.loads(p.read_text(encoding="utf-8"))
              print(f"valid JSON: {p}")
          PY
      - name: Validate template Go module
        working-directory: templates/go-module
        run: |
          go test ./...
          go vet ./...
      - name: Registry paths exist
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          reg = json.load(open("registry.json", encoding="utf-8"))
          missing = []
          for m in reg["modules"]:
              for key in ("manifest", "changelog", "icon"):
                  p = m.get(key)
                  if p and not Path(p).is_file():
                      missing.append(f"{m['id']}: {key} -> {p}")
          if missing:
              print("referenced files do not exist:")
              for x in missing:
                  print("  " + x)
              sys.exit(1)
          print("all referenced paths exist")
          PY
      - name: Report module count
        run: |
          python - <<'PY'
          import json
          reg = json.load(open("registry.json", encoding="utf-8"))
          ids = [m["id"] for m in reg["modules"]]
          print(f"::notice title=Modules::{len(ids)} module(s): {', '.join(ids)}")
          PY
