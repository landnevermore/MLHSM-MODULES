[package]
name = "mlgsm"
version = "0.1.0"
edition = "2021"
description = "MLGameServerManager — external module for game server management (eggs, lifecycle, files)"

[dependencies]
hsm-model = { path = "../../shared/hsm-model" }
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.8", features = ["ws", "multipart", "json", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
bollard = "0.21"
futures-util = "0.3"
walkdir = "2"
zip = "2"
tar = "0.4"
flate2 = "1"
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
